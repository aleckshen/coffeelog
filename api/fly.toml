# fly.toml app configuration file generated for coffeelog-api on 2026-11-21T08:28:12+11:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'coffeelog-api'
primary_region = 'syd'

[build]

[deploy]
  release_command = 'node src/db/migrate.ts up'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
