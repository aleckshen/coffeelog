name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: biomejs/setup-biome@v2
      - run: biome ci . --error-on-warnings

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm --dir api install --frozen-lockfile
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir api typecheck
      - run: pnpm --dir app typecheck
